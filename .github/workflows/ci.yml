name: Backend quality and container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: amrutam-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: amrutam-backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      - run: npm run validate:openapi
      - run: npm audit --audit-level=moderate
      - run: docker build -t amrutam-backend:ci .
