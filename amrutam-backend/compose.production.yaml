services:
  edge:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set a public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
volumes:
  caddy_data:
